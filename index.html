<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo-KTF: Knowledge Visualization and Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6775;
      --line: #d7dde5;
      --wash: #f3f6f9;
      --accent: #1f4e79;
    }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #e8eef5 0%, transparent 42%),
        radial-gradient(circle at 88% 0%, #edf3ea 0%, transparent 36%),
        var(--wash);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    }
    .ui-sans { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    #viz-wrap {
      position: relative;
      height: min(78vh, calc(100vh - 7rem));
      min-height: 520px;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      background: linear-gradient(180deg, #f7fafc 0%, #eef3f8 100%);
    }
    #viz-wrap.is-panning { cursor: grabbing; }
    #pack-svg { width: 100%; height: 100%; display: block; }
    .pack-label {
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #1c2430;
      font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 650;
      paint-order: stroke;
      stroke: rgba(255,255,255,0.82);
      stroke-width: 2px;
    }
    .pack-circle { cursor: pointer; }
    .pack-circle:hover { stroke-width: 2.6px !important; }
    .crumb-btn:hover { color: var(--accent); }
    .tool-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 0.95rem 1.05rem;
    }
    .tool-blurb {
      margin-top: 0.55rem;
      font-size: 0.9rem;
      line-height: 1.55;
      color: #3a4553;
    }
    .child-link { color: #1f4e79; }
    .child-link:hover { text-decoration: underline; }
    .goal-banner {
      margin-top: 1rem;
      border: 1px solid rgba(28, 36, 48, 0.12);
      border-radius: 16px;
      padding: 0.95rem 1.05rem;
    }
    .goal-verb {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1c2430;
      background: rgba(255,255,255,0.72);
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
    }
    .goal-grid {
      display: grid;
      gap: 0.65rem;
      margin-top: 0.85rem;
    }
    .goal-item {
      border: 1px solid rgba(28, 36, 48, 0.12);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .goal-item:hover { filter: brightness(0.97); transform: translateY(-1px); }
    .hint-pill {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      z-index: 5;
      background: rgba(255,255,255,0.92);
      border: 1px solid #d7dde5;
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      font-size: 12px;
      color: #5b6775;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="min-h-screen">
    <header class="ui-sans border-b border-slate-200/80 bg-white/85 backdrop-blur px-4 py-4 sm:px-6 lg:px-8">
      <div class="mx-auto flex max-w-[1400px] flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">
            Geo-KTF: Knowledge Visualization and Search
          </h1>
        </div>
        <div id="stats" class="ui-sans flex gap-4 text-sm text-slate-600"></div>
      </div>
    </header>

    <main class="mx-auto grid max-w-[1400px] gap-0 lg:grid-cols-[minmax(0,1.2fr)_minmax(340px,0.8fr)]">
      <section class="border-b border-slate-200 lg:border-b-0 lg:border-r">
        <div class="ui-sans relative z-10 flex flex-wrap items-center gap-2 px-4 pt-4">
          <div class="flex flex-wrap items-center gap-2 rounded-full bg-white/95 px-3 py-1.5 text-sm text-slate-600 shadow-sm ring-1 ring-slate-200">
            <button id="btn-back" class="crumb-btn font-medium text-slate-800 disabled:text-slate-400" disabled>Back</button>
            <button id="btn-reset" class="crumb-btn text-slate-500">Reset</button>
            <span class="text-slate-300">/</span>
            <div id="breadcrumb" class="flex flex-wrap items-center gap-1"></div>
          </div>
        </div>
        <div id="viz-wrap">
          <svg id="pack-svg" role="img" aria-label="Geo-KTF circle packing visualization"></svg>
        </div>
      </section>

      <aside class="ui-sans bg-white/75 px-5 py-6 sm:px-7 lg:max-h-[calc(100vh-6.5rem)] lg:overflow-y-auto">
        <div id="detail"></div>
      </aside>
    </main>
  </div>

  <script>
    const raw = JSON.parse(document.getElementById("geo-ktf-data").textContent);
    const TOOL_INFO = JSON.parse(document.getElementById("tool-info").textContent);

    const COLORS = ["#9ec5e8","#f2d28b","#b9d7a5","#f0b7a4","#cbb6e4","#9fd3d0"];

    function countTools(node) {
      if (node.tools) return node.tools.length;
      return (node.children || []).reduce((s, c) => s + countTools(c), 0);
    }
    function countLeaves(node) {
      if (node.tools) return 1;
      return (node.children || []).reduce((s, c) => s + countLeaves(c), 0);
    }
    function flattenLeaves(node) {
      if (node.tools) return [node];
      return (node.children || []).flatMap(flattenLeaves);
    }

    const leaves = flattenLeaves(raw);
    const totalTools = new Set(leaves.flatMap((l) => l.tools)).size;
    document.getElementById("stats").innerHTML = `
      <div><span class="font-semibold text-slate-900">${raw.children.length}</span> sections</div>
      <div><span class="font-semibold text-slate-900">${leaves.length}</span> concepts</div>
      <div><span class="font-semibold text-slate-900">${totalTools}</span> unique tools</div>
    `;

    const wrap = document.getElementById("viz-wrap");
    const svg = d3.select("#pack-svg");
    const g = svg.append("g");

    let width = 800, height = 800;
    function resize() {
      const rect = wrap.getBoundingClientRect();
      width = Math.max(480, rect.width);
      height = Math.max(480, rect.height);
      svg.attr("viewBox", `0 0 ${width} ${height}`);
    }
    resize();

    const hierarchy = d3.hierarchy(raw)
      .sum((d) => (d.tools ? Math.max(d.tools.length, 3) : 0))
      .sort((a, b) => (b.value || 0) - (a.value || 0));

    const root = d3.pack().size([width, height]).padding((d) => (d.depth < 2 ? 8 : 4))(hierarchy);
    let focus = root;
    let selected = root;

    root.eachBefore((d) => {
      if (d.depth === 0) d.color = "#e8eef4";
      else if (d.depth === 1) d.color = COLORS[d.parent.children.indexOf(d) % COLORS.length];
      else d.color = d3.color(d.parent.color).brighter(0.28 + d.depth * 0.05).formatHex();
    });

    const node = g.selectAll("circle")
      .data(root.descendants().slice(1))
      .join("circle")
      .attr("class", "pack-circle")
      .attr("cx", (d) => d.x)
      .attr("cy", (d) => d.y)
      .attr("r", (d) => d.r)
      .attr("fill", (d) => (d.children ? d.color : "#ffffff"))
      .attr("fill-opacity", (d) => (d.children ? 0.9 : 0.98))
      .attr("stroke", (d) => (d.children ? d3.color(d.color).darker(0.4) : "#8e9bab"))
      .attr("stroke-width", 1.2)
      .each(function(d) {
        d3.select(this).selectAll("title").data([d.data.name]).join("title").text((t) => t);
      });

    const label = g.selectAll("text")
      .data(root.descendants().slice(1))
      .join("text")
      .attr("class", "pack-label")
      .attr("x", (d) => d.x)
      .attr("y", (d) => d.y)
      .style("display", "none");

    // Free mouse zoom + pan
    const zoomBehavior = d3.zoom()
      .scaleExtent([0.35, 48])
      .clickDistance(8)
      .filter((event) => {
        if (event.type === "wheel") return true;
        // ignore right/middle buttons
        return !event.ctrlKey && !event.button;
      })
      .on("start", (event) => {
        if (event.sourceEvent && event.sourceEvent.type !== "wheel") {
          wrap.classList.add("is-panning");
        }
      })
      .on("end", () => wrap.classList.remove("is-panning"))
      .on("zoom", (event) => {
        g.attr("transform", event.transform);
        updateLabels(event.transform.k);
      });

    svg.call(zoomBehavior);
    wrap.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });

    // Click-to-open with drag threshold (works with d3.zoom)
    let pointerDown = null;
    node
      .style("pointer-events", "all")
      .on("pointerdown", (event, d) => {
        pointerDown = { x: event.clientX, y: event.clientY, id: d };
      })
      .on("click", (event, d) => {
        // Ignore click if this was a pan gesture
        if (pointerDown && pointerDown.id === d) {
          const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
          pointerDown = null;
          if (moved > 8) return;
        }
        event.stopPropagation();
        openNode(d);
      });

    svg.on("dblclick.zoom", null); // disable default d3 double-click zoom reset
    svg.on("dblclick", (event) => {
      event.preventDefault();
      if (focus.parent) openNode(focus.parent, true);
      else resetView();
    });

    document.getElementById("btn-back").addEventListener("click", () => {
      if (focus.parent) openNode(focus.parent, true);
    });
    document.getElementById("btn-reset").addEventListener("click", () => resetView());

    function fitTo(d, animate = true) {
      focus = d;
      const pad = 1.12;
      const k = Math.min(width, height) / (d.r * 2 * pad);
      const x = width / 2 - d.x * k;
      const y = height / 2 - d.y * k;
      const transform = d3.zoomIdentity.translate(x, y).scale(k);
      const t = svg.transition().duration(animate ? 500 : 0);
      t.call(zoomBehavior.transform, transform)
        .on("end", () => updateLabels(d3.zoomTransform(svg.node()).k));
      // also update immediately for duration 0 / first frame
      updateLabels(k);
      document.getElementById("btn-back").disabled = !focus.parent;
    }

    function openNode(d, forceFit = false) {
      selected = d;
      renderDetail(d);
      renderBreadcrumb(d);
      if (d.children) fitTo(d, true);
      else if (forceFit && d.parent) fitTo(d.parent, true);
      else if (!d.children && d.parent && focus !== d.parent) fitTo(d.parent, true);
      // highlight selected
      node.attr("stroke-width", (n) => (n === d ? 2.8 : 1.2))
          .attr("stroke", (n) => (n === d ? "#1f4e79" : (n.children ? d3.color(n.color).darker(0.4) : "#8e9bab")));
    }

    function resetView() {
      openNode(root, true);
      fitTo(root, true);
    }

    function wrapLabel(text, radiusPx) {
      // Always prefer full readable names; wrap long phrases onto multiple lines.
      const maxChars = Math.max(5, Math.floor(radiusPx / 11));
      if (text.length <= maxChars) return [text];
      const words = text.split(/\s+/);
      if (words.length === 1) return [text]; // never truncate single words like "Scale"
      const lines = [];
      let line = "";
      for (const w of words) {
        const next = line ? line + " " + w : w;
        if (next.length > maxChars && line) {
          lines.push(line);
          line = w;
        } else line = next;
      }
      if (line) lines.push(line);
      return lines.slice(0, 4);
    }

    function updateLabels(k) {
      const scale = k || 1;
      label.each(function (d) {
        const el = d3.select(this);
        const isChildOfFocus = d.parent === focus;
        const isSelectedLeaf = d === selected && !d.children;
        const visible = isChildOfFocus || isSelectedLeaf;
        if (!visible) {
          el.style("display", "none");
          return;
        }
        const rPx = d.r * scale;
        if (rPx < 28) {
          el.style("display", "none");
          return;
        }
        const lines = wrapLabel(d.data.name, rPx).slice(0, 2);
        const font = Math.max(7, Math.min(9.5, rPx / 11));
        el.style("display", "block")
          .style("font-size", font + "px")
          .attr("x", d.x)
          .attr("y", d.y)
          .selectAll("tspan").remove();
        el.selectAll("tspan")
          .data(lines)
          .join("tspan")
          .attr("x", d.x)
          .attr("dy", (_, i) => (i === 0 ? `${-((lines.length - 1) * 0.55)}em` : "1.15em"))
          .text((t) => t);
      });
    }

    function pathOf(d) {
      return d.ancestors().reverse().map((n) => n.data.name);
    }

    function toolMeta(name) {
      return TOOL_INFO[name] || {
        source: "Geo-KTF registry",
        blurb: "Representative geospatial tool or operation linked to this concept.",
      };
    }

    function renderBreadcrumb(d) {
      const parts = d.ancestors().reverse();
      const el = document.getElementById("breadcrumb");
      el.innerHTML = parts.map((n, i) => {
        const name = n.data.name;
        const short = name.length > 30 ? name.slice(0, 29) + "…" : name;
        return `<button class="crumb-btn ${i === parts.length - 1 ? "font-semibold text-slate-900" : "text-slate-500"}">${escapeHtml(short)}</button>`;
      }).join('<span class="text-slate-300 mx-0.5">/</span>');
      el.querySelectorAll("button").forEach((btn, i) => {
        btn.addEventListener("click", () => openNode(parts[i], true));
      });
    }

    function renderDetail(d) {
      const data = d.data;
      const tools = data.tools || [];
      const children = d.children || [];
      const path = pathOf(d).join(" › ");
      let goalHtml = "";
      if (data.goal_verb && data.goal) {
        const sectionColor = d.color || COLORS[Math.max(0, d.depth === 1 ? d.parent.children.indexOf(d) : 0)] || "#e8eef4";
        goalHtml = `
          <div class="goal-banner" style="background:${sectionColor}">
            <div class="goal-verb">${escapeHtml(data.goal_verb)}</div>
            <p class="mt-2 text-[0.98rem] leading-6 text-slate-800">${escapeHtml(data.goal)}</p>
          </div>`;
      } else if (d.depth === 0) {
        const pillars = (d.children || []).filter((c) => c.data.goal_verb);
        if (pillars.length) {
          goalHtml = `
            <div class="mt-5">
              <h3 class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-500">Framework goals</h3>
              <p class="mt-2 text-sm leading-6 text-slate-600">Each major circle has a purpose in the Geo-KTF pipeline.</p>
              <div class="goal-grid">
                ${pillars.map((c, i) => `
                  <button class="goal-item" data-child="${escapeHtml(c.data.name)}" style="background:${c.color || COLORS[i % COLORS.length]}">
                    <div class="goal-verb">${escapeHtml(c.data.goal_verb)}</div>
                    <div class="mt-1.5 text-sm font-semibold text-slate-900">${escapeHtml(c.data.name)}</div>
                    <div class="mt-1 text-sm leading-5 text-slate-700">${escapeHtml(c.data.goal)}</div>
                  </button>`).join("")}
              </div>
            </div>`;
        }
      }

      // Root overview already shows Framework goals cards; skip duplicate Subtopics list there.
      const childrenHtml = (children.length && d.depth > 0) ? `
        <div class="mt-6">
          <h3 class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-500">Subtopics [${children.length}]</h3>
          <ul class="mt-3 space-y-2">
            ${children.map((c) => `
              <li>
                <button class="child-link text-left" data-child="${escapeHtml(c.data.name)}">${escapeHtml(c.data.name)}</button>
                <span class="ml-2 text-xs text-slate-400">${countTools(c.data)} tools</span>
              </li>`).join("")}
          </ul>
        </div>` : "";

      const toolsHtml = tools.length ? `
        <div class="mt-6">
          <h3 class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-500">Tools [${tools.length}]</h3>
          <p class="mt-2 text-sm leading-6 text-slate-600">Where each tool comes from, and what it does.</p>
          <div class="mt-3 space-y-2.5">
            ${tools.map((t) => {
              const meta = toolMeta(t);
              return `<div class="tool-card">
                <div class="flex flex-wrap items-baseline justify-between gap-2">
                  <div class="font-semibold text-slate-900">${escapeHtml(t)}</div>
                  <div class="text-[11px] uppercase tracking-wide text-slate-500">${escapeHtml(meta.source)}</div>
                </div>
                <p class="tool-blurb">${escapeHtml(meta.blurb)}</p>
              </div>`;
            }).join("")}
          </div>
        </div>` : "";

      document.getElementById("detail").innerHTML = `
        <h2 class="text-2xl font-semibold tracking-tight text-slate-900">${escapeHtml(data.name)}</h2>
        <p class="mt-2 text-xs text-slate-400">${escapeHtml(path)}</p>
        <p class="mt-4 text-[0.98rem] leading-7 text-slate-700">${escapeHtml(data.description || "")}</p>
        ${goalHtml}
        <div class="mt-5 grid grid-cols-2 gap-3">
          <div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
            <div class="text-xs uppercase tracking-wide text-slate-500">Concepts</div>
            <div class="mt-1 text-xl font-semibold">${countLeaves(data)}</div>
          </div>
          <div class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
            <div class="text-xs uppercase tracking-wide text-slate-500">Tools</div>
            <div class="mt-1 text-xl font-semibold">${countTools(data)}</div>
          </div>
        </div>
        ${childrenHtml}
        ${toolsHtml}
      `;

      document.querySelectorAll("[data-child]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const child = children.find((c) => c.data.name === btn.getAttribute("data-child"));
          if (child) openNode(child);
        });
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    window.addEventListener("resize", () => {
      // keep current camera; only update svg box
      resize();
    });

    selected = root;
    focus = root;
    fitTo(root, false);
    renderDetail(root);
    renderBreadcrumb(root);
    updateLabels(d3.zoomTransform(svg.node()).k || 1);
  </script>
</body>
</html>
